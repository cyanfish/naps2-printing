name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build naps2-printing.slnx -c Release
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: nupkg
        path: NAPS2.Windows.Printing/bin/Release/*.nupkg
